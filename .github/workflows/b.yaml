name: Download from MediaFire

on:
  workflow_dispatch:
    inputs:
      mediafire_url:
        description: "MediaFire download URL"
        required: true

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install wget
        run: |
          sudo apt-get update
          sudo apt-get install -y wget

      - name: Download file
        run: |
          mkdir -p downloads
          wget -O downloads/app.ipa "${{ github.event.inputs.mediafire_url }}"

      - name: Create Release and Upload IPA
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: downloads/app.ipa
          generate_release_notes: true
